name: flora_orm
repository: https://github.com/tatlacas-com/flora_orm/tree/main
issue_tracker: https://github.com/tatlacas-com/flora_orm/issues
description: Flutter plugin for ORM in front of storage like sqflite and shared_preferences
version: 4.1.0

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  web:
  macos:
  linux:
  windows:

topics:
  - sql
  - database
  - orm
  - storage
  - persistence

funding:
  - https://github.com/sponsors/tatlacas-com

environment: 
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies: 
  analyzer: ^9.0.0
  build: ^4.0.3
  build_config: ^1.1.1
  collection: ^1.18.0
  equatable: ^2.0.3
  flutter: 
    sdk: flutter
  meta: ^1.7.0
  path: ^1.9.0
  path_provider: ^2.0.11
  shared_preferences: ^2.0.15
  source_gen: ^4.1.1
  sqflite: ^2.0.3
  sqflite_common: ^2.5.4+5
  sqflite_common_ffi: ^2.3.4
  uuid: ^4.2.2

dev_dependencies: 
  build_runner: ^2.4.9
  flutter_test: 
    sdk: flutter
  mockito: any
  pubspec_dependency_sorter: ^1.0.4
  very_good_analysis: ^10.0.0
